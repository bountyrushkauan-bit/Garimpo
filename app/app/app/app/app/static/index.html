<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garimpeiro PCW</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080a0f;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            border-bottom: 1px solid #20242c;
            padding: 28px 20px;
        }

        .header-content {
            max-width: 1150px;
            margin: auto;
        }

        h1 {
            margin: 0;
            font-size: 34px;
        }

        .subtitle {
            color: #999;
            margin-top: 8px;
        }

        main {
            max-width: 1150px;
            margin: auto;
            padding: 25px 20px 60px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        select,
        button {
            background: #15181e;
            border: 1px solid #30343d;
            color: white;
            padding: 11px 15px;
            border-radius: 9px;
            cursor: pointer;
        }

        button:hover {
            background: #20242b;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 16px;
        }

        .card {
            background: #11141a;
            border: 1px solid #242933;
            border-radius: 15px;
            padding: 18px;
            transition: 0.15s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #3b414d;
        }

        .deal {
            display: inline-block;
            background: #12351f;
            color: #70e49a;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .category {
            color: #8d96a3;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.3;
        }

        .store {
            color: #8d96a3;
            font-size: 14px;
            margin-top: 9px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-top: 16px;
        }

        .old-price {
            color: #777;
            text-decoration: line-through;
            margin-top: 4px;
        }

        .discount {
            color: #70e49a;
            font-weight: bold;
            margin-top: 7px;
        }

        .buy {
            display: block;
            text-align: center;
            background: #f5f5f5;
            color: #090a0d;
            padding: 11px;
            border-radius: 9px;
            margin-top: 17px;
            font-weight: bold;
            text-decoration: none;
        }

        .buy:hover {
            opacity: 0.9;
        }

        .status {
            color: #8d96a3;
            margin-bottom: 18px;
        }

        .empty {
            color: #777;
            padding: 30px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .price {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>🔥 Garimpeiro PCW</h1>

        <div class="subtitle">
            Caçando preços bons de hardware para você.
        </div>
    </div>
</header>


<main>

    <div class="toolbar">

        <select id="category">
            <option value="">Todas as categorias</option>
            <option value="SSD">SSD</option>
            <option value="GPU">GPU</option>
            <option value="CPU">CPU</option>
            <option value="RAM">RAM</option>
            <option value="Monitor">Monitor</option>
            <option value="Fonte">Fonte</option>
            <option value="Cooler">Cooler</option>
            <option value="Gabinete">Gabinete</option>
        </select>

        <button onclick="loadProducts(false)">
            Todos
        </button>

        <button onclick="loadProducts(true)">
            🔥 Só ofertas
        </button>

    </div>


    <div id="status" class="status">
        Carregando ofertas...
    </div>


    <div
        id="products"
        class="products">
    </div>

</main>


<script>

async function loadProducts(dealsOnly) {

    const category =
        document.getElementById("category").value;

    const params = new URLSearchParams();

    if (category) {
        params.set("category", category);
    }

    if (dealsOnly) {
        params.set("deals_only", "true");
    }


    const status =
        document.getElementById("status");

    const container =
        document.getElementById("products");


    status.textContent =
        "Carregando ofertas...";


    try {

        const response =
            await fetch(
                "/api/products?" +
                params.toString()
            );


        if (!response.ok) {
            throw new Error(
                "Erro ao buscar produtos"
            );
        }


        const products =
            await response.json();


        container.innerHTML = "";


        if (products.length === 0) {

            container.innerHTML =
                '<div class="empty">' +
                'Nenhuma oferta encontrada.' +
                '</div>';

            status.textContent =
                "0 ofertas encontradas.";

            return;
        }


        status.textContent =
            products.length +
            " oferta(s) encontrada(s).";


        products.forEach(product => {

            const card =
                document.createElement("article");

            card.className = "card";


            let discount = "";

            if (
                product.old_price &&
                product.old_price > product.price
            ) {

                const value =
                    (
                        (
                            product.old_price -
                            product.price
                        ) /
                        product.old_price
                    ) * 100;


                discount =
                    `<div class="discount">
                        -${value.toFixed(0)}%
                    </div>`;
            }


            card.innerHTML = `

                ${
                    product.is_deal
                    ? '<span class="deal">🔥 OFERTA</span>'
                    : ''
                }

                <div class="category">
                    ${escapeHtml(product.category)}
                </div>

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="store">
                    ${escapeHtml(product.store)}
                </div>

                <div class="price">
                    R$ ${formatPrice(product.price)}
                </div>

                ${
                    product.old_price
                    ? `
                    <div class="old-price">
                        R$ ${formatPrice(
                            product.old_price
                        )}
                    </div>
                    `
                    : ""
                }

                ${discount}

                <a
                    class="buy"
                    href="${escapeAttribute(product.url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Ver oferta →
                </a>

            `;


            container.appendChild(card);

        });


    } catch (error) {

        console.error(error);

        status.textContent =
            "Não foi possível carregar as ofertas.";

    }
}


function formatPrice(value) {

    return Number(value).toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
}


loadProducts(false);

</script>

</body>
  </html>
